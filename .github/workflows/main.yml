name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cielo Chill
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar plataforma y herramientas de compilación
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Encuentra settings.gradle aunque el proyecto esté dentro de una subcarpeta.
      - name: Detectar carpeta del proyecto Android
        shell: bash
        run: |
          PROJECT_DIR="$(find . -type f -name settings.gradle -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "No se encontró el proyecto Android. Debe contener settings.gradle y app/build.gradle."
            echo "Archivos Gradle encontrados:"
            find . -maxdepth 5 \( -name settings.gradle -o -name build.gradle \) -print
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Android detectado en: $PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de depuración
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CieloChill-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14name: Android APK

